name: carbon_footprint_calculation_app
description: Karbon ayak izi hesaplama ve takip uygulaması
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  firebase_database: ^11.1.4

  # State Management
  provider: ^6.1.1

  # UI & Charts
  fl_chart: ^0.65.0

  # HTTP & Networking
  http: ^1.1.2
  web_socket_channel: ^2.4.0
  connectivity_plus: ^6.0.5

  # Image Processing
  image_picker: ^1.0.7
  image: ^4.3.0
  google_mlkit_text_recognition: ^0.15.0

  # Utilities
  flutter_dotenv: ^5.2.1
  url_launcher: ^6.2.2
  shared_preferences: ^2.2.2
  pdf: ^3.11.3
  printing: ^5.14.2
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1
  flutter_timezone: ^5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/logoCo2.png
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/config/env.example
    - assets/images/
    # Web: 'assets/' ile başlayan anahtarlar çoğu zaman assets/assets/... 404 verir;
    # PDF TTF'leri proje kökündeki fonts/ altında (tek assets/ öneki).
    - fonts/NotoSans-Regular.ttf
    - fonts/NotoSans-Bold.ttf
    - fonts/OpenSans-Regular.ttf
    - fonts/OpenSans-Bold.ttf

  fonts:
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/OpenSans-Regular.ttf
        - asset: assets/fonts/OpenSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/OpenSans-Bold.ttf
          weight: 600
        - asset: assets/fonts/OpenSans-Regular.ttf
          weight: 500
        - asset: assets/fonts/OpenSans-Bold.ttf
          weight: 900
