name: carbon_footprint_calculation_app
description: Karbon ayak izi hesaplama ve takip uygulaması
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  firebase_database: ^11.1.4

  # State Management
  provider: ^6.1.1

  # UI & Charts
  fl_chart: ^0.65.0

  # HTTP & Networking
  http: ^1.1.2
  web_socket_channel: ^2.4.0
  connectivity_plus: ^6.0.5

  # Image Processing
  image_picker: ^1.0.7
  image: ^4.3.0
  google_mlkit_text_recognition: ^0.11.0

  # Utilities
  url_launcher: ^6.2.2
  shared_preferences: ^2.2.2
  pdf: ^3.11.3
  printing: ^5.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Regular.ttf
        - asset: assets/fonts/PlayfairDisplay-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlayfairDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlayfairDisplay-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlayfairDisplay-Black.ttf
          weight: 900
